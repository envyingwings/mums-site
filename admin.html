<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Bookings</title>
<link rel="stylesheet" href="styles.css">
<style>
  .page { max-width: 780px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th, td { text-align: left; padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-soft); }
  .cancel-btn { background: none; border: 1px solid var(--danger); color: var(--danger); border-radius: 6px; padding: 0.3rem 0.6rem; font: inherit; font-size: 0.82rem; cursor: pointer; }
  .cancel-btn:hover { background: #fdecea; }
  .status-cancelled { color: var(--ink-soft); text-decoration: line-through; }
  #login-box { max-width: 340px; margin: 4rem auto 0; }
  .tabbar { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
  .tab-btn { padding: 0.5rem 1rem; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font: inherit; }
  .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .whole-day-toggle { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; padding: 0.75rem 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0.25rem 0; cursor: pointer; }
  .whole-day-toggle input { width: auto; }
  .block-slot { display: flex; align-items: center; gap: 0.4rem; padding: 0.5rem 0.6rem; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 0.88rem; }
  .block-slot input { width: auto; margin: 0; }
  .block-slot.checked { background: var(--accent-soft); border-color: var(--accent); }
  #avail-blocks-wrap.disabled { opacity: 0.4; pointer-events: none; }
</style>
</head>
<body>
  <div class="page">
    <div id="login-box" class="step">
      <div class="step-label">Admin login</div>
      <form id="login-form">
        <label for="admin-email">Email</label>
        <input type="email" id="admin-email" required autocomplete="username">
        <label for="admin-password">Password</label>
        <input type="password" id="admin-password" required autocomplete="current-password">
        <div id="login-error" class="form-error" role="alert" hidden></div>
        <button type="submit" class="primary-btn">Log in</button>
      </form>
    </div>

    <div id="admin-panel" hidden>
      <header class="page-header">
        <h1>Admin</h1>
        <button id="logout-btn" class="secondary-btn" style="margin-top:0.5rem;">Log out</button>
      </header>

      <div class="tabbar" id="page-tabbar">
        <button class="tab-btn active" data-page="bookings">Bookings</button>
        <button class="tab-btn" data-page="availability">Availability</button>
      </div>

      <div id="page-bookings">
        <div class="tabbar">
          <button class="tab-btn active" data-filter="upcoming">Upcoming</button>
          <button class="tab-btn" data-filter="all">All</button>
          <button class="tab-btn" data-filter="cancelled">Cancelled</button>
        </div>
        <div id="bookings-table"><p class="loading">Loading bookings…</p></div>
      </div>

      <div id="page-availability" hidden>
        <div class="step">
          <div class="date-nav">
            <button id="avail-prev-day" class="nav-btn" aria-label="Previous day">‹</button>
            <div id="avail-current-date" class="current-date"></div>
            <button id="avail-next-day" class="nav-btn" aria-label="Next day">›</button>
          </div>

          <label class="whole-day-toggle">
            <input type="checkbox" id="block-whole-day">
            Block the whole day
          </label>

          <div id="avail-blocks-wrap">
            <p class="step-label" style="margin-top:1rem;">Check the times to block off</p>
            <div id="avail-blocks" class="slot-list"></div>
          </div>

          <div id="avail-error" class="form-error" role="alert" hidden></div>
          <button id="save-availability" class="primary-btn">Save changes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
